<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lead Capture Agent — Google Maps & Email Extractor</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <!-- Header -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-8">
      <div>
        <h1 class="text-3xl font-bold tracking-tight text-white">Lead Capture Agent</h1>
        <p class="text-slate-400 mt-1">Extract Google Maps businesses, phone numbers, websites &amp; emails by country and city.</p>
      </div>
      <div class="flex items-center gap-3 flex-wrap">
        <span id="savedBadge" class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-medium bg-cyan-500/10 text-cyan-300 border border-cyan-500/20">
          Saved History: <strong id="savedCount">0</strong> leads
        </span>
        <button id="downloadAllBtn" type="button" class="hidden px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/15 text-emerald-300 border border-emerald-500/30 hover:bg-emerald-500/25 transition">
          Download All Saved (CSV)
        </button>
        <button id="clearHistoryBtn" type="button" class="hidden px-3 py-1 rounded-full text-xs font-medium bg-rose-500/10 text-rose-300 border border-rose-500/25 hover:bg-rose-500/20 transition">
          Clear History
        </button>
      </div>
    </div>

    <!-- Search Card -->
    <form id="scrapeForm" class="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 shadow-xl mb-8 space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
        <div class="md:col-span-5">
          <label for="query" class="block text-sm font-medium text-slate-300 mb-2">Business / Niche</label>
          <input
            id="query"
            type="text"
            required
            placeholder='e.g. "Factory gloves", "Dentists", "Real Estate"'
            class="w-full rounded-xl bg-slate-950 border border-slate-700 px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500"
          />
        </div>
        <div class="md:col-span-3">
          <label for="country" class="block text-sm font-medium text-slate-300 mb-2">Country</label>
          <select
            id="country"
            class="w-full rounded-xl bg-slate-950 border border-slate-700 px-4 py-3 text-slate-100 focus:outline-none focus:ring-2 focus:ring-cyan-500"
          >
            <option value="">Any / Worldwide</option>
            <option value="United States">United States (USA)</option>
            <option value="United Kingdom">United Kingdom (UK)</option>
            <option value="Canada">Canada</option>
            <option value="Australia">Australia</option>
            <option value="United Arab Emirates">United Arab Emirates (UAE)</option>
            <option value="Saudi Arabia">Saudi Arabia</option>
            <option value="Pakistan">Pakistan</option>
            <option value="India">India</option>
            <option value="Germany">Germany</option>
            <option value="France">France</option>
            <option value="Turkey">Turkey</option>
            <option value="Singapore">Singapore</option>
            <option value="Malaysia">Malaysia</option>
          </select>
        </div>
        <div class="md:col-span-3">
          <label for="city" class="block text-sm font-medium text-slate-300 mb-2">City / State / Area</label>
          <input
            id="city"
            type="text"
            placeholder='e.g. "New York", "Dubai", "Lahore"'
            class="w-full rounded-xl bg-slate-950 border border-slate-700 px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500"
          />
        </div>
        <div class="md:col-span-1">
          <label for="limit" class="block text-sm font-medium text-slate-300 mb-2">Limit</label>
          <input
            id="limit"
            type="number"
            min="1"
            max="50"
            value="10"
            class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-3 text-slate-100 focus:outline-none focus:ring-2 focus:ring-cyan-500"
          />
        </div>
      </div>

      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 pt-2 border-t border-slate-800/80">
        <div class="flex flex-wrap gap-6">
          <label class="inline-flex items-center gap-2 cursor-pointer text-sm text-slate-300">
            <input id="skipDuplicates" type="checkbox" checked class="rounded bg-slate-950 border-slate-700 text-cyan-500 focus:ring-cyan-500" />
            Skip Previously Captured
          </label>
          <label class="inline-flex items-center gap-2 cursor-pointer text-sm text-slate-300">
            <input id="skipEmails" type="checkbox" class="rounded bg-slate-950 border-slate-700 text-cyan-500 focus:ring-cyan-500" />
            Skip Email Scan (Faster)
          </label>
        </div>
        <button
          id="submitBtn"
          type="submit"
          class="rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-semibold py-2.5 px-7 transition disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Capture Leads
        </button>
      </div>
    </form>

    <!-- Loading Banner -->
    <div id="loadingBanner" class="hidden bg-cyan-500/10 border border-cyan-500/30 rounded-xl p-4 mb-8 flex items-center gap-3 text-cyan-300">
      <svg class="animate-spin h-5 w-5 text-cyan-400 shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
      </svg>
      <span id="loadingText">Starting scraper...</span>
    </div>

    <!-- Error Banner -->
    <div id="errorBanner" class="hidden bg-rose-500/10 border border-rose-500/30 rounded-xl p-4 mb-8 text-rose-300"></div>

    <!-- Results Section -->
    <div id="resultsSection" class="hidden space-y-6">
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 bg-slate-900/70 border border-slate-800 rounded-2xl p-5">
        <div class="flex flex-wrap items-center gap-6">
          <div>
            <p class="text-xs uppercase tracking-wider text-slate-400">New Leads</p>
            <p id="statTotal" class="text-2xl font-bold text-white">0</p>
          </div>
          <div>
            <p class="text-xs uppercase tracking-wider text-slate-400">With Emails</p>
            <p id="statEmails" class="text-2xl font-bold text-emerald-400">0</p>
          </div>
          <label class="inline-flex items-center gap-2 cursor-pointer text-sm text-slate-300 pl-2 border-l border-slate-800">
            <input id="filterEmailOnly" type="checkbox" class="rounded bg-slate-950 border-slate-700 text-emerald-500 focus:ring-emerald-500" />
            Show Only With Email
          </label>
        </div>
        <div class="flex gap-3">
          <a id="downloadXlsx" href="#" class="px-4 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-semibold text-sm transition">
            Download Excel (.xlsx)
          </a>
          <a id="downloadCsv" href="#" class="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-100 font-semibold text-sm border border-slate-700 transition">
            Download CSV
          </a>
        </div>
      </div>

      <div class="bg-slate-900/80 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm">
            <thead class="bg-slate-950/80 text-slate-400 uppercase text-xs border-b border-slate-800">
              <tr>
                <th class="px-4 py-3.5">Business</th>
                <th class="px-4 py-3.5">Category</th>
                <th class="px-4 py-3.5">Phone</th>
                <th class="px-4 py-3.5">Emails</th>
                <th class="px-4 py-3.5">Website</th>
                <th class="px-4 py-3.5">Rating</th>
              </tr>
            </thead>
            <tbody id="leadsTableBody" class="divide-y divide-slate-800/70"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "lead_capture_agent_history_v1";
    const form = document.getElementById("scrapeForm");
    const submitBtn = document.getElementById("submitBtn");
    const loadingBanner = document.getElementById("loadingBanner");
    const loadingText = document.getElementById("loadingText");
    const errorBanner = document.getElementById("errorBanner");
    const resultsSection = document.getElementById("resultsSection");
    const tbody = document.getElementById("leadsTableBody");
    const savedCountEl = document.getElementById("savedCount");
    const downloadAllBtn = document.getElementById("downloadAllBtn");
    const clearHistoryBtn = document.getElementById("clearHistoryBtn");
    const filterEmailOnly = document.getElementById("filterEmailOnly");

    let currentLeads = [];

    function getHistory() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      } catch {
        return [];
      }
    }

    function saveToHistory(newLeads) {
      const existing = getHistory();
      const seen = new Set(existing.map((l) => (l.maps_url || l.name).split("?")[0].toLowerCase()));
      for (const lead of newLeads) {
        const key = (lead.maps_url || lead.name || "").split("?")[0].toLowerCase();
        if (key && !seen.has(key)) {
          seen.add(key);
          existing.push(lead);
        }
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(existing));
      refreshHistoryUI();
    }

    function refreshHistoryUI() {
      const history = getHistory();
      savedCountEl.textContent = history.length;
      const hasData = history.length > 0;
      downloadAllBtn.classList.toggle("hidden", !hasData);
      clearHistoryBtn.classList.toggle("hidden", !hasData);
    }

    downloadAllBtn.addEventListener("click", () => {
      const history = getHistory();
      if (!history.length) return;
      const headers = ["Business Name", "Category", "Phone", "Emails", "Website", "Rating", "Reviews", "Address", "Facebook", "Instagram", "LinkedIn", "Google Maps URL"];
      const fields = ["name", "category", "phone", "emails", "website", "rating", "reviews", "address", "facebook", "instagram", "linkedin", "maps_url"];
      const csvRows = [headers.join(",")];
      for (const item of history) {
        csvRows.push(fields.map((f) => `"${String(item[f] || "").replace(/"/g, '""')}"`).join(","));
      }
      const blob = new Blob(["\uFEFF" + csvRows.join("\n")], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `all_saved_leads_${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    });

    clearHistoryBtn.addEventListener("click", () => {
      if (confirm("Clear all saved leads history from this browser?")) {
        localStorage.removeItem(STORAGE_KEY);
        refreshHistoryUI();
      }
    });

    function escapeHtml(str) {
      return (str || "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function renderTable() {
      const onlyEmail = filterEmailOnly.checked;
      const visible = onlyEmail ? currentLeads.filter((l) => l.emails && l.emails.trim()) : currentLeads;
      tbody.innerHTML = visible.map((lead) => `
        <tr class="hover:bg-slate-800/40">
          <td class="px-4 py-3 font-medium text-white">
            ${lead.maps_url ? `<a href="${escapeHtml(lead.maps_url)}" target="_blank" class="hover:text-cyan-400 underline decoration-slate-700">${escapeHtml(lead.name)}</a>` : escapeHtml(lead.name)}
          </td>
          <td class="px-4 py-3 text-slate-400">${escapeHtml(lead.category) || "-"}</td>
          <td class="px-4 py-3 text-emerald-400 whitespace-nowrap">${escapeHtml(lead.phone) || "-"}</td>
          <td class="px-4 py-3 text-amber-300">${escapeHtml(lead.emails) || "-"}</td>
          <td class="px-4 py-3 text-cyan-400 max-w-xs truncate">
            ${lead.website ? `<a href="${escapeHtml(lead.website)}" target="_blank" class="hover:underline">${escapeHtml(lead.website)}</a>` : "-"}
          </td>
          <td class="px-4 py-3 text-slate-300 whitespace-nowrap">${lead.rating ? `${escapeHtml(lead.rating)} (${escapeHtml(lead.reviews || "0")})` : "-"}</td>
        </tr>
      `).join("");
    }

    filterEmailOnly.addEventListener("change", renderTable);

    async function pollJob(jobId) {
      while (true) {
        const res = await fetch(`/api/jobs/${jobId}`);
        if (!res.ok) throw new Error(`Job check failed (${res.status})`);
        const job = await res.json();
        if (job.message) loadingText.textContent = job.message;
        if (job.status === "done") return job.result;
        if (job.status === "error") throw new Error(job.error || "Scraping failed");
        await new Promise((r) => setTimeout(r, 2000));
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const query = document.getElementById("query").value.trim();
      const country = document.getElementById("country").value.trim();
      const city = document.getElementById("city").value.trim();
      const limit = parseInt(document.getElementById("limit").value, 10) || 10;
      const skip_emails = document.getElementById("skipEmails").checked;
      const skipDuplicates = document.getElementById("skipDuplicates").checked;
      const exclude_urls = skipDuplicates
        ? getHistory().map((l) => l.maps_url).filter(Boolean)
        : [];

      errorBanner.classList.add("hidden");
      resultsSection.classList.add("hidden");
      loadingText.textContent = "Starting scraper...";
      loadingBanner.classList.remove("hidden");
      submitBtn.disabled = true;

      try {
        const startRes = await fetch("/api/scrape", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query, country, city, limit, skip_emails, exclude_urls }),
        });

        if (!startRes.ok) throw new Error(`Server error (${startRes.status})`);
        const { job_id } = await startRes.json();
        const data = await pollJob(job_id);

        if (!data.leads || data.leads.length === 0) {
          errorBanner.textContent = "No new leads found for this query. Try a broader search or uncheck 'Skip Previously Captured'.";
          errorBanner.classList.remove("hidden");
          return;
        }

        currentLeads = data.leads;
        saveToHistory(currentLeads);

        document.getElementById("statTotal").textContent = data.total;
        document.getElementById("statEmails").textContent = data.emails_found;
        document.getElementById("downloadXlsx").href = `/api/download/${encodeURIComponent(data.xlsx_file)}`;
        document.getElementById("downloadCsv").href = `/api/download/${encodeURIComponent(data.csv_file)}`;

        renderTable();
        resultsSection.classList.remove("hidden");
      } catch (err) {
        errorBanner.textContent = err.message || "Something went wrong while capturing leads.";
        errorBanner.classList.remove("hidden");
      } finally {
        loadingBanner.classList.add("hidden");
        submitBtn.disabled = false;
      }
    });

    refreshHistoryUI();
  </script>
</body>
</html>
